<!-- src/app.html -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#1db954" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Spotifx" />
		<meta name="description" content="Weekly Spotify streaming charts for multiple countries" />
		<script>
			window.addEventListener('error', function(e) {
				const div = document.createElement('div');
				div.style = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:999999;padding:20px;font-family:monospace;white-space:pre-wrap;';
				div.textContent = 'ERROR: ' + e.message + '\n\n' + e.error?.stack;
				document.body.appendChild(div);
			});
			window.addEventListener('unhandledrejection', function(e) {
				const div = document.createElement('div');
				div.style = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:999999;padding:20px;font-family:monospace;white-space:pre-wrap;';
				div.textContent = 'PROMISE REJECTION: ' + (e.reason?.message || e.reason) + '\n\n' + e.reason?.stack;
				document.body.appendChild(div);
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
